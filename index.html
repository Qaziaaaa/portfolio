    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Critical CSS for immediate rendering */
      body{margin:0;background:#faf9f5;color:#222222;font-family:"Open Sans",system-ui,-apple-system,sans-serif;overflow-x:hidden;overflow-x:clip}
      .skip-link{position:absolute;top:-100%;left:50%;transform:translateX(-50%);z-index:10000;padding:8px 16px;background:#141413;color:#fff;font-size:14px;font-weight:600;border-radius:0 0 8px 8px;text-decoration:none;transition:top .2s}
      .skip-link:focus{top:0}
      #root{min-height:100vh}
      /* Boot loader */
      #boot-loader{position:fixed;inset:0;z-index:9999;background-color:#faf9f5;display:flex;align-items:center;justify-content:center;transition:opacity .55s ease}
      #boot-loader.loader-hidden{opacity:0;pointer-events:none}
      .bl-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
      .bl-polaroid{position:relative;background:transparent;border:none;border-radius:0;padding:0;box-shadow:none;animation:bl-pop .5s cubic-bezier(.34,1.56,.64,1) both}
      .bl-polaroid img{width:112px;height:112px;aspect-ratio:1;object-fit:cover;object-position:center top;display:block;background:#f0eee6;border:1px solid #e5e2d9;border-radius:16px}
      .bl-cap{display:block;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;color:#222;margin-top:12px;font-weight:400;letter-spacing:-.02em}
      .bl-loading{font-family:Georgia,"Times New Roman",serif;font-size:1.35rem;color:#222;display:inline-flex;align-items:flex-end;gap:4px}
      .bl-dots{width:7px;height:7px;border-radius:50%;background:#141413;animation:bl-bounce 1s infinite ease-in-out}
      .bl-dots:nth-of-type(2){animation-delay:.15s}
      .bl-dots:nth-of-type(3){animation-delay:.3s}
      .bl-tag{font-family:"Open Sans",system-ui,sans-serif;font-size:.82rem;color:#7c7968;margin-top:2px;letter-spacing:.3px}
      @keyframes bl-pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes bl-bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-8px);opacity:1}}
    </style>
